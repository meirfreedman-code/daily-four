name: drills-pages

# מפרסם את אפליקציית התרגילים (public/drills) ל-GitHub Pages בכל push ל-main.
# מפרסם את כל public, כדי לא למחוק את קבצי החדשות שכבר מתפרסמים משם.
on:
  push:
    branches: [main]
    paths:
      - "public/drills/**"
      - "drills-test/**"
      - ".github/workflows/drills-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drills-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}drills/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (shape recognition + explanation)
        run: node --test "drills-test/*.test.js"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
