# הגדרות ה-Worker לניתוח. סודות (APP_TOKEN, GEMINI_API_KEY) לא כאן: הם נשמרים עם `wrangler secret put`.
name = "daily-four-analyze"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# יעודכן לכתובת ה-GitHub Pages שלך
DATA_BASE_URL = "https://meirfreedman-code.github.io/daily-four"
ANALYZE_MODELS = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash"
MAX_PER_DAY = "15"
MAX_PER_MINUTE = "4"

[[kv_namespaces]]
binding = "CACHE"
id = "ec26bf126ecf423fb1a33d987eaa2ddc"
